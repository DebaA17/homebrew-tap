name: 🐛 Bug Report
description: Report a bug or issue with one of the formulae in this tap
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us resolve the issue.
  - type: dropdown
    id: formula
    attributes:
      label: Affected Formula
      description: Select the formula you are experiencing issues with
      options:
        - cvecli
        - omnifetch
        - Other / Tap itself
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this issue?
      placeholder: |
        1. Run `brew install ...`
        2. Execute `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: terminal-output
    attributes:
      label: Terminal Output / Error Logs
      description: Please paste any relevant command line outputs or error logs here
      render: bash
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: |
        Please run `brew config` and paste the output here (especially macOS/Linux version and Homebrew version)
      render: bash
    validations:
      required: true
